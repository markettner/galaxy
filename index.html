<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy</title>
<!-- Derived from icons/favicon-source-96.png, the only master that
     exists — see icons/README.md to regenerate. Opaque black tile is
     deliberate: the mark is white, so it needs its own ground to stay visible
     against a light tab bar. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    /* Navigation is intercepted, not native scroll — there is nothing to
       scroll. This stops iOS pull-to-refresh and the rubber-band bounce from
       fighting a swipe that is meant to change the shape. */
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: #000;
    color: #f5f6fb;
    font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Segoe UI, sans-serif;
    overflow: hidden;
  }
  /* canvas + its two compositing layers, isolated so plus-lighter blends
     against the render rather than the page */
  .hero { position: fixed; inset: 0; isolation: isolate; }
  #stage { display: block; width: 100vw; height: 100vh; }

  /* The ambient backdrop: additive navy that only ever adds light —
     the faint horizon glow. */
  .ambient-backdrop {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: plus-lighter;
    background-image: radial-gradient(
      rgba(0, 0, 0, 0) 0%,
      rgba(35, 67, 95, 0.0625) 25%,
      rgba(35, 67, 95, 0.25) 50%,
      rgba(35, 67, 95, 0.5625) 75%,
      rgb(35, 67, 95) 100%
    );
  }

  /* The vignette that sits over it — this is what keeps the corners dark and
     leaves the glow reading along the bottom and side edges. */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(
      circle,
      rgba(0, 0, 0, 0) 47%,
      rgba(0, 0, 0, 0.18) 72%,
      rgba(0, 0, 0, 0.78) 100%
    );
  }

</style>
</head>
<body>

<div class="hero">
  <canvas id="stage"></canvas>
  <div class="ambient-backdrop"></div>
  <div class="vignette"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="src/shaders.js"></script>
<script src="src/arms.js"></script>
<script src="src/field.js"></script>
<script src="src/shaders_post.js"></script>
<script src="src/dirt.js"></script>
<script src="src/postfx.js"></script>
<script src="src/motion.js"></script>
<script src="src/shape.js"></script>
<script src="src/scroll.js"></script>
<script src="src/main.js"></script>

</body>
</html>
